name: DPL Music Ultra Source Build

on:
  push:
    branches: [dpl-music-ultra-8-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dpl-music-ultra-source-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android 17 SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Clone pinned Metrolist source
        run: |
          git clone --filter=blob:none https://github.com/MetrolistGroup/Metrolist.git Metrolist
          cd Metrolist
          git checkout 6be77c1db3f515dfe3512f581931bdfadd3f68d4
          git submodule update --init --recursive

      - name: Apply DPL source patches
        run: python3 dpl_music_build/dpl_patch.py

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: Metrolist
        env:
          METROLIST_APPLICATION_ID: com.dplmusic.app
          METROLIST_APP_NAME: DPL Music Ultra
          PULL_REQUEST: 'true'
          GITHUB_EVENT_NAME: pull_request
          LASTFM_API_KEY: ''
          LASTFM_SECRET: ''
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:testIzzyDebugUnitTest --warning-mode summary

      - name: Build DPL Music APK
        working-directory: Metrolist
        env:
          METROLIST_APPLICATION_ID: com.dplmusic.app
          METROLIST_APP_NAME: DPL Music Ultra
          PULL_REQUEST: 'true'
          GITHUB_EVENT_NAME: pull_request
          LASTFM_API_KEY: ''
          LASTFM_SECRET: ''
        run: ./gradlew --console=plain :app:assembleIzzyDebug --warning-mode summary -x lint

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find Metrolist/app/build/outputs/apk/izzy/debug -type f -name '*.apk' | head -1)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/DPL_Music_Ultra_8.0.0_SOURCE.apk
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs dist/DPL_Music_Ultra_8.0.0_SOURCE.apk | tee dist/APKSIGNER.txt
          unzip -t dist/DPL_Music_Ultra_8.0.0_SOURCE.apk > dist/ZIP_TEST.txt
          sha256sum dist/DPL_Music_Ultra_8.0.0_SOURCE.apk > dist/SHA256SUMS.txt
          cp dpl_music_build/dpl_patch.py dist/dpl_patch.py
          printf '%s\n' \
            'DPL Music Ultra 8.0.0 - source build' \
            'Package: com.dplmusic.app' \
            'Base: Metrolist GPL-3.0 commit 6be77c1db3f515dfe3512f581931bdfadd3f68d4' \
            'compileSdk: 37 / targetSdk: 36 / minSdk: 26' \
            'Offline mirror: MediaStore Music/DPL Music/Offline' \
            'Stream resolver: current pinned Metrolist InnerTubeXPlayer with expired URL invalidation' \
            'Test build uses Android debug signing; uninstall differently-signed DPL build before install.' \
            > dist/BUILD_NOTES.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DPL-Music-Ultra-8-source-build
          path: dist/*
          retention-days: 7
          if-no-files-found: error
