name: DPL Music Ultra 8 Build

on:
  push:
    branches:
      - dpl-music-ultra-8-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify DPL Music Ultra 8.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;35.0.0" "platform-tools"

      - name: Clone pinned Metrolist source
        run: |
          git clone https://github.com/MetrolistGroup/Metrolist.git Metrolist
          cd Metrolist
          git checkout 6be77c1db3f515dfe3512f581931bdfadd3f68d4
          git submodule update --init --recursive

      - name: Apply DPL patches
        run: python3 dpl_music_build/dpl_patch.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and run unit tests
        working-directory: Metrolist
        env:
          METROLIST_APPLICATION_ID: com.dpl.music.ultra
          METROLIST_APP_NAME: DPL Music Ultra
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: push
          LASTFM_API_KEY: ''
          LASTFM_SECRET: ''
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:testIzzyDebugUnitTest --warning-mode summary

      - name: Build release APK
        working-directory: Metrolist
        env:
          METROLIST_APPLICATION_ID: com.dpl.music.ultra
          METROLIST_APP_NAME: DPL Music Ultra
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: push
          LASTFM_API_KEY: ''
          LASTFM_SECRET: ''
        run: |
          ./gradlew --console=plain :app:assembleIzzyRelease --warning-mode summary -x lint -x lintIzzyRelease

      - name: Align and sign release
        run: |
          set -euxo pipefail
          UNSIGNED="$(find Metrolist/app/build/outputs/apk/izzy/release -type f -name '*unsigned*.apk' | head -1)"
          test -n "$UNSIGNED"
          mkdir -p dist

          keytool -genkeypair \
            -keystore dist/dpl-music-ultra.keystore \
            -storepass DplMusicUltra8 \
            -keypass DplMusicUltra8 \
            -alias dplmusicultra \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=DPL Music Ultra, OU=DPL, O=DPL, L=Montes Claros, ST=MG, C=BR"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" dist/DPL_Music_Ultra_8.0.0-aligned.apk
          "$APKSIGNER" sign \
            --ks dist/dpl-music-ultra.keystore \
            --ks-key-alias dplmusicultra \
            --ks-pass pass:DplMusicUltra8 \
            --key-pass pass:DplMusicUltra8 \
            --out dist/DPL_Music_Ultra_8.0.0.apk \
            dist/DPL_Music_Ultra_8.0.0-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs dist/DPL_Music_Ultra_8.0.0.apk | tee dist/apksigner-verification.txt
          rm -f dist/DPL_Music_Ultra_8.0.0-aligned.apk dist/dpl-music-ultra.keystore
          sha256sum dist/DPL_Music_Ultra_8.0.0.apk | tee dist/SHA256SUMS.txt

      - name: Generate source notice
        run: |
          cat > dist/SOURCE_AND_CHANGES.txt <<'EOF'
          DPL Music Ultra 8.0.0

          Base source:
          - MetrolistGroup/Metrolist
          - GPL-3.0
          - pinned commit: 6be77c1db3f515dfe3512f581931bdfadd3f68d4

          Reference used for download/offline design:
          - Shabinder/SpotiFlyer
          - GPL-3.0
          - foreground download/storage concepts only; no wholesale code copy

          DPL-specific changes:
          - app id com.dpl.music.ultra and DPL Music Ultra branding
          - version 8.0.0 / versionCode 800
          - latest pinned Metrolist playback/download fixes
          - real public offline mirror in Music/DPL Music/Offline on Android 10+
          - Storage screen displays the real offline folder path
          - completed Media3 downloads are exported atomically to MediaStore
          - removing an offline download removes its public mirror
          - clear-all now uses Media3 DownloadManager instead of deleting cache files behind its index
          - existing completed downloads are reconciled to the public folder on startup
          - release build uses the Izzy/FOSS flavor with Metrolist updater disabled

          The complete corresponding source is the pinned upstream tree plus dpl_patch.py in this build branch.
          EOF
          cp dpl_music_build/dpl_patch.py dist/dpl_patch.py

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPL-Music-Ultra-8.0.0
          path: |
            dist/DPL_Music_Ultra_8.0.0.apk
            dist/SHA256SUMS.txt
            dist/apksigner-verification.txt
            dist/SOURCE_AND_CHANGES.txt
            dist/dpl_patch.py
          retention-days: 7
          if-no-files-found: error
