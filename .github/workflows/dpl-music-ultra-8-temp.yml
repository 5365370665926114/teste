name: DPL Music Ultra 8 Temporary Build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and verify DPL Music Ultra 8.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build host
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load DPL patcher from isolated build branch
        run: |
          git fetch origin dpl-music-ultra-8-build:dpl-music-ultra-8-build
          mkdir -p dpl_music_build
          git show dpl-music-ultra-8-build:dpl_music_build/dpl_patch.py > dpl_music_build/dpl_patch.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;35.0.0" "platform-tools"

      - name: Clone pinned Metrolist source
        run: |
          git clone https://github.com/MetrolistGroup/Metrolist.git Metrolist
          cd Metrolist
          git checkout 6be77c1db3f515dfe3512f581931bdfadd3f68d4
          git submodule update --init --recursive

      - name: Apply DPL patches
        run: python3 dpl_music_build/dpl_patch.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and run unit tests
        working-directory: Metrolist
        env:
          METROLIST_APPLICATION_ID: com.dpl.music.ultra
          METROLIST_APP_NAME: DPL Music Ultra
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: push
          LASTFM_API_KEY: ''
          LASTFM_SECRET: ''
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:testIzzyDebugUnitTest --warning-mode summary

      - name: Build release APK
        working-directory: Metrolist
        env:
          METROLIST_APPLICATION_ID: com.dpl.music.ultra
          METROLIST_APP_NAME: DPL Music Ultra
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: push
          LASTFM_API_KEY: ''
          LASTFM_SECRET: ''
        run: |
          ./gradlew --console=plain :app:assembleIzzyRelease --warning-mode summary -x lint -x lintIzzyRelease

      - name: Align and sign release
        run: |
          set -euxo pipefail
          UNSIGNED="$(find Metrolist/app/build/outputs/apk/izzy/release -type f -name '*unsigned*.apk' | head -1)"
          test -n "$UNSIGNED"
          mkdir -p dist
          keytool -genkeypair -keystore dist/dpl-music-ultra.keystore -storepass DplMusicUltra8 -keypass DplMusicUltra8 -alias dplmusicultra -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=DPL Music Ultra, OU=DPL, O=DPL, L=Montes Claros, ST=MG, C=BR"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" dist/DPL_Music_Ultra_8.0.0-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks dist/dpl-music-ultra.keystore --ks-key-alias dplmusicultra --ks-pass pass:DplMusicUltra8 --key-pass pass:DplMusicUltra8 --out dist/DPL_Music_Ultra_8.0.0.apk dist/DPL_Music_Ultra_8.0.0-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/DPL_Music_Ultra_8.0.0.apk | tee dist/apksigner-verification.txt
          rm -f dist/DPL_Music_Ultra_8.0.0-aligned.apk dist/dpl-music-ultra.keystore
          sha256sum dist/DPL_Music_Ultra_8.0.0.apk | tee dist/SHA256SUMS.txt

      - name: Generate source notice
        run: |
          cat > dist/SOURCE_AND_CHANGES.txt <<'EOF'
          DPL Music Ultra 8.0.0
          Base: MetrolistGroup/Metrolist, GPL-3.0, commit 6be77c1db3f515dfe3512f581931bdfadd3f68d4.
          Reference: Shabinder/SpotiFlyer, GPL-3.0, for foreground-download/storage design concepts.
          Changes: DPL branding/package/version, current upstream fixes, public offline mirror under Music/DPL Music/Offline, visible offline path in Storage, proper Media3 clear-all flow, reconciliation of completed downloads, updater-disabled Izzy/FOSS release.
          Corresponding source: pinned upstream source plus dpl_patch.py from branch dpl-music-ultra-8-build.
          EOF
          cp dpl_music_build/dpl_patch.py dist/dpl_patch.py

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPL-Music-Ultra-8.0.0
          path: |
            dist/DPL_Music_Ultra_8.0.0.apk
            dist/SHA256SUMS.txt
            dist/apksigner-verification.txt
            dist/SOURCE_AND_CHANGES.txt
            dist/dpl_patch.py
          retention-days: 7
          if-no-files-found: error
